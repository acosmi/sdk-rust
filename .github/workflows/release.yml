name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version and successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success \
            --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | length > 0' \
            | grep -qx true

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --no-default-features
      - run: cargo build --all-features

      - run: cargo publish --dry-run

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify published bytes and record provenance
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          mkdir -p release-assets
          package="acosmi-sdk-$version.crate"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
            "https://static.crates.io/crates/acosmi-sdk/$package" -o "release-assets/$package"
          cmp "target/package/$package" "release-assets/$package"
          (cd release-assets && sha256sum "$package" > SHA256SUMS)
          hash=$(sha256sum "release-assets/$package" | cut -d ' ' -f 1)
          jq -n --arg version "$version" --arg commit "$GITHUB_SHA" --arg sha256 "$hash" \
            '{crate:"acosmi-sdk",version:$version,source_commit:$commit,sha256:$sha256}' \
            > release-assets/source.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
